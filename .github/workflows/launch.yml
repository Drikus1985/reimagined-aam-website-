name: Full production launch

# One-button launch, run entirely from GitHub's servers:
#   1. infra  — finds the Supabase project, resets the DB password, builds
#               connection strings (never printed; masked in logs)
#   2. data   — schema migrate, seed, 723-product catalogue import, pricing,
#               photo migration + commit (scripts/go-live.sh, non-interactive)
#   3. deploy — creates/links the Vercel project, sets env vars, deploys main
#   4. smoke  — the 19-check smoke test against the live deployment
#
# Needs TWO repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_TOKEN — Supabase personal access token (sbp_...)
#   VERCEL_TOKEN   — Vercel personal access token
#
# Revoke both tokens after a successful launch.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets are configured
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$SUPABASE_TOKEN" ] && missing="SUPABASE_TOKEN"
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: "Phase 1: Supabase infra (connection strings)"
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: node scripts/launch-cloud.mjs infra

      - name: Configure git identity for the photo commit
        run: |
          git config user.name "aam-launch"
          git config user.email "info@allamericanmuscle.co.za"

      - name: "Phase 2: Full data load (schema, catalogue, pricing, photos)"
        run: bash scripts/go-live.sh </dev/null

      - name: "Phase 3: Vercel project + production deployment"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/launch-cloud.mjs deploy

      - name: "Phase 4: 19-check smoke test"
        run: node scripts/smoke-test.mjs "$DEPLOY_URL"

      - name: Upload image-migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-migration-report
          path: reports/image-migration-report.md
          if-no-files-found: ignore
